<!doctype html>
<html>
<head><meta charset="utf-8"><title>turntable</title>
<style>html,body{margin:0;background:#20242b;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildAircraft, animateAircraft } from '/src/flight/AircraftFactory.js';
import { AIRCRAFT, AIRCRAFT_ORDER } from '/src/data/aircraft.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1200, 800);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);

// A room environment gives real reflections, which is the only honest way to judge
// whether the metal reads as metal and the glass reads as glass.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
key.position.set(6, 9, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const d = 18;
Object.assign(key.shadow.camera, { left: -d, right: d, top: d, bottom: -d, near: 1, far: 60 });
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.04;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9ec7ff, 1.1);
rim.position.set(-7, 4, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x3a3a3a, 0.55));

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x2a2f37, roughness: 0.9, metalness: 0 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(30, 1200 / 800, 0.1, 400);

let current = null;
const box = new THREE.Box3();
const size = new THREE.Vector3();
const centre = new THREE.Vector3();

window.showAircraft = (id, paint = 'factory') => {
  if (current) scene.remove(current);
  current = buildAircraft(AIRCRAFT[id], paint);
  // Gear down for the studio, so the undercarriage can be judged too.
  animateAircraft(current, 1.0, { speed: 0, throttle: 0, grounded: true, airspeed: 0, gearDown: true }, { pitch: 0, roll: 0, yaw: 0 });
  animateAircraft(current, 1.0, { speed: 0, throttle: 0, grounded: true, airspeed: 0, gearDown: true }, { pitch: 0, roll: 0, yaw: 0 });
  scene.add(current);
  box.setFromObject(current);
  box.getSize(size); box.getCenter(centre);
  // Stand it on the ground.
  current.position.y -= box.min.y;
  box.setFromObject(current); box.getCenter(centre);
  return { size: size.toArray(), tris: countTris(current), meshes: countMeshes(current) };
};

function countTris(root) {
  let t = 0;
  root.traverse((o) => { if (o.isMesh) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  return Math.round(t);
}
function countMeshes(root) { let n = 0; root.traverse((o) => { if (o.isMesh) n++; }); return n; }

window.setView = (azDeg, elDeg, zoom = 1) => {
  const r = Math.max(size.x, size.y, size.z) * 1.35 * zoom;
  const az = azDeg * Math.PI / 180;
  const el = elDeg * Math.PI / 180;
  camera.position.set(
    centre.x + Math.cos(el) * Math.sin(az) * r,
    centre.y + Math.sin(el) * r,
    centre.z + Math.cos(el) * Math.cos(az) * r,
  );
  camera.lookAt(centre);
  renderer.render(scene, camera);
};
window.__ready = true;
window.AIRCRAFT_ORDER = AIRCRAFT_ORDER;
</script>
</body>
</html>
